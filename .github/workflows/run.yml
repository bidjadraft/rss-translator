name: Apps Bot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure required directories and files
        run: |
          mkdir -p config rss
          [ -f config/last_post.json ] || echo '{}' > config/last_post.json
          [ -f config/feeds.txt ] || printf '# RSS Feeds List\n' > config/feeds.txt

      - name: Run Apps Bot
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and push RSS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss/ config/last_post.json
          git commit -m "Update RSS feeds and tracker [skip ci]" || echo "No changes to commit"
          git push
