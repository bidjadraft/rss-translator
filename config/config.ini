[credentials]
ollama_api_key = YOUR_OLLAMA_TOKEN

[models]
ollama_models = gpt-oss:120b-cloud, gpt-oss:20b, gemma4:31b-cloud

[settings]
language = arabic
# Choose: translate or summary
type = translate
# Number of posts to keep per feed (default: 20)
max_posts = 20
# Merge all feeds into one XML file: yes or no
merge_feeds = yes
